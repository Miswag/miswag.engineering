name: Sync to Public Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

    steps:
      - name: Checkout internal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token exists
        run: |
          if [ -z "$TOKEN" ]; then
            echo "PUBLIC_REPO_TOKEN is empty"
            exit 1
          fi

          echo "PUBLIC_REPO_TOKEN detected"

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone public repo
        run: |
          git clone https://github.com/Miswag/miswag.engineering.git public-repo

      - name: Preserve public repo workflows
        run: |
          rm -rf .github
          cp -r public-repo/.github .github

      - name: Cleanup cloned repo
        run: |
          rm -rf public-repo

      - name: Create sync branch
        run: |
          git checkout -B sync-public

      - name: Commit changes
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: preserve public workflows"
          fi

      - name: Push to public repository
        run: |
          git remote add public https://x-access-token:${TOKEN}@github.com/Miswag/miswag.engineering.git

          git push public sync-public:main --force