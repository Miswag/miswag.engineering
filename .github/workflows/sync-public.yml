name: Sync to Public Repo

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout internal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to public repo (preserve public .github)
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Clone public repo to get its .github folder
          git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/Miswag/miswag.engineering.git public-repo

          # Copy public repo's .github into our working tree
          rm -rf .github
          cp -r public-repo/.github .github
          rm -rf public-repo

          # Stage and commit with public .github preserved
          git checkout -b sync-public
          git add -A
          git commit -m "sync: preserve public workflows"

          git remote add public https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/Miswag/miswag.engineering.git
          git push public sync-public:main --force
