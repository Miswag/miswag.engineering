name: Sync to Public Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

    steps:
      - name: Checkout internal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TOKEN IS EMPTY"
            exit 1
          fi

          echo "TOKEN OK"

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Clone public repo
        run: |
          git clone https://github.com/Miswag/miswag.engineering.git public-repo

      - name: Preserve public workflows
        run: |
          rm -rf .github
          cp -r public-repo/.github .github
          rm -rf public-repo

      - name: Create sync commit
        run: |
          git checkout -B sync-public

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "sync: preserve public workflows"
          fi

      - name: Push to public repo
        run: |
          git remote add public https://x-access-token:${TOKEN}@github.com/Miswag/miswag.engineering.git

          git push public sync-public:main --force