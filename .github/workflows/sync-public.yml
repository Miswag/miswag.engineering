name: Sync to Public Repo

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  sync:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout internal repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to public repo (preserve public .github)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Configure git to use the token for github.com
          git config --global credential.helper store
          echo "https://oauth2:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com" > ~/.git-credentials

          # Clone public repo without auth (it's public) to get its .github folder
          git clone https://github.com/Miswag/miswag.engineering.git public-repo

          # Replace our .github with the public repo's .github
          rm -rf .github
          cp -r public-repo/.github .github
          rm -rf public-repo

          # Stage and commit with public .github preserved
          git checkout -b sync-public
          git add -A
          git commit -m "sync: preserve public workflows"

          git remote add public https://github.com/Miswag/miswag.engineering.git
          git push public sync-public:main --force
